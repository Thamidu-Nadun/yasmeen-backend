#secure-build.yml
name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    outputs:
      scan-passed: ${{ steps.gate.outputs.passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Backend SAST
      - name: Run Semgrep Backend
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/security-audit
          sarif_file: semgrep-backend.sarif
          timeout: 300

      - name: Upload Semgrep Backend SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-backend
          path: semgrep-backend.sarif
          if-no-files-found: warn

      # Backend dependency scan
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict --requirement requirements.txt

      # Checkout and scan frontend
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Thamidu-Nadun/yasmeen-frontend
          path: frontend

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Semgrep Frontend
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/secrets
          directory: frontend
          sarif_file: semgrep-frontend.sarif

      - name: Upload Semgrep Frontend SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-frontend
          path: semgrep-frontend.sarif
          if-no-files-found: warn

      # Secret scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build backend Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: yasmeen-backend:ci-scan
          cache-from: type=registry,ref=nadundev/yasmeen-backend:cache
          cache-to: type=registry,ref=nadundev/yasmeen-backend:cache,mode=max

      # Container vulnerability scan
      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          image-ref: yasmeen-backend:ci-scan
          format: sarif
          output: trivy-scan.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-scan
          path: trivy-scan.sarif
          if-no-files-found: warn

      # Generate SBOM
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          image-ref: yasmeen-backend:ci-scan
          format: spdx-json
          output: sbom-backend.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          if-no-files-found: error

      # Security gate result
      - name: Security gate result
        id: gate
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: security-scan

    if: >
      needs.security-scan.outputs.scan-passed == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262