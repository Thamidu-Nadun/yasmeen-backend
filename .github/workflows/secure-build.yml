#secure-build.yml
name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    outputs:
      scan-passed: ${{ steps.gate.outputs.passed }}

    steps:
      # Checkout backend
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Backend SAST
      - name: Run Semgrep Backend
        id: semgrep-backend
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/security-audit
          sarif_file: semgrep-backend.sarif
          timeout: 300

      - name: Upload Semgrep Backend SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-backend
          path: semgrep-backend.sarif
          if-no-files-found: warn

      # Backend dependency scan
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        id: install-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        id: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict --requirement requirements.txt

      # Checkout and scan frontend
      - name: Checkout frontend
        id: checkout-frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Thamidu-Nadun/yasmeen-frontend
          path: frontend
          # If the frontend repository is private, provide a PAT:
          # token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: install-frontend
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Semgrep Frontend
        id: semgrep-frontend
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/secrets
          directory: frontend
          sarif_file: semgrep-frontend.sarif

      - name: Upload Semgrep Frontend SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-frontend
          path: semgrep-frontend.sarif
          if-no-files-found: warn

      # Secret scanning
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build backend Docker image
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        id: docker-login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        id: build-backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: yasmeen-backend:ci-scan
          cache-from: type=registry,ref=nadundev/yasmeen-backend:cache
          cache-to: type=registry,ref=nadundev/yasmeen-backend:cache,mode=max

      # Container vulnerability scan
      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          image-ref: yasmeen-backend:ci-scan
          format: sarif
          output: trivy-scan.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-scan
          path: trivy-scan.sarif
          if-no-files-found: warn

      # Generate SBOM
      - name: Generate SBOM
        id: generate-sbom
        if: always() && steps.build-backend.outcome == 'success'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:latest \
            image \
            --format spdx-json \
            --output /workspace/sbom-backend.spdx.json \
            yasmeen-backend:ci-scan

      - name: Verify SBOM
        id: verify-sbom
        if: always() && steps.generate-sbom.outcome == 'success'
        run: |
          if [ ! -s sbom-backend.spdx.json ]; then
            echo "::error::SBOM file is missing or empty"
            exit 1
          fi

          echo "SBOM generated successfully"
          ls -lh sbom-backend.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          if-no-files-found: warn

      # Enforce the security gate
      - name: Security gate result
        id: gate
        if: always()
        env:
          SEMGREP_BACKEND: ${{ steps.semgrep-backend.outcome }}
          PIP_AUDIT: ${{ steps.pip-audit.outcome }}
          NPM_AUDIT: ${{ steps.npm-audit.outcome }}
          SEMGREP_FRONTEND: ${{ steps.semgrep-frontend.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          BUILD_BACKEND: ${{ steps.build-backend.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          GENERATE_SBOM: ${{ steps.generate-sbom.outcome }}
          VERIFY_SBOM: ${{ steps.verify-sbom.outcome }}
        run: |
          failed=0

          for check in \
            SEMGREP_BACKEND \
            PIP_AUDIT \
            NPM_AUDIT \
            SEMGREP_FRONTEND \
            GITLEAKS \
            BUILD_BACKEND \
            TRIVY \
            GENERATE_SBOM \
            VERIFY_SBOM
          do
            value="${!check}"
            echo "$check: ${value:-not_run}"

            if [ "$value" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "All required security checks passed."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::One or more security checks failed."
          fi

  # Production deployment
  deploy:
    needs: security-scan

    if: >-
      needs.security-scan.outputs.scan-passed == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: production

